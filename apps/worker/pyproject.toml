[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aviary-worker"
version = "0.1.1"
description = "SSH orchestration worker for Aviary platform"
requires-python = ">=3.13"
dependencies = [
  "asyncpg>=0.30.0",
  "asyncssh>=2.15.0",
  "cryptography>=44.0.0",
  "grpcio>=1.78.0",
  "protobuf>=6.31.1",
  "python-dotenv>=1.1.0"
]

[project.scripts]
aviary-worker = "aviary_worker.main:cli"

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "pytest-asyncio>=0.24.0"
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
